<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#1c2226">
    <title>Completed | To-Do</title>
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.webmanifest">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <main class="app-container">
        <header class="app-header">
            <h1>Completed</h1>
            <button id="theme-toggle" type="button" aria-label="Switch to dark mode" title="Switch to dark mode">&#9790;</button>
        </header>
        <a class="back-to-tasks" href="index.html">&larr; Back to My Tasks</a>
        <p id="sync-status" class="sync-status" role="status" aria-live="polite">Loading saved tasks...</p>
        <p id="completed-status" class="trash-status" aria-live="polite">Loading completed tasks...</p>
        <ul id="completed-list" class="completed-task-list"></ul>
    </main>
    <script src="supabase-client.js"></script>
    <script src="task-storage.js"></script>
    <script src="completed.js"></script>
</body>
</html>
