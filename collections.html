<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#1c2226">
    <title>Collections | To-Do</title>
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.webmanifest">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <main class="app-container collection-container">
        <header class="app-header">
            <h1 id="collection-title">Brain Dump Inbox</h1>
            <button id="theme-toggle" type="button" aria-label="Switch to dark mode" title="Switch to dark mode">&#9790;</button>
        </header>

        <p id="sync-status" class="sync-status" role="status" aria-live="polite">Loading saved items...</p>

        <form id="collection-form" class="collection-form">
            <label id="collection-input-label" for="collection-input">Brain dump</label>
            <textarea id="collection-input" rows="4" placeholder=""></textarea>
            <button id="collection-submit" type="submit">Save dump</button>
        </form>

        <p id="collection-status" class="collection-status" aria-live="polite"></p>
        <ul id="collection-list" class="collection-list"></ul>
    </main>

    <div id="bottom-nav-root"></div>
    <script src="supabase-client.js"></script>
    <script src="task-storage.js"></script>
    <script src="bottom-nav.js"></script>
    <script src="collections.js"></script>
</body>
</html>
